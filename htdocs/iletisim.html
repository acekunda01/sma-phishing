<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim Sayfası</title>
  <style>
    body {
      background: url('https://via.placeholder.com/1500') no-repeat center center fixed;
      background-size: cover;
      color: #333;
      font-family: Arial, sans-serif;
    }
    .contact-page {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    header {
      text-align: center;
      margin-top: 50px;
    }
    header h1 {
      color: #FF66B2;
      font-size: 36px;
    }
    .contact-info {
      margin-bottom: 30px;
    }
    .contact-info h2 {
      color: #FF66B2;
      margin-bottom: 10px;
    }
    .contact-info p {
      font-size: 18px;
      margin: 10px 0;
    }
    .contact-info a {
      color: #FF66B2;
      text-decoration: none;
    }
    .contact-form {
      margin-top: 30px;
    }
    .contact-form h2 {
      color: #FF66B2;
      margin-bottom: 20px;
    }
    .contact-form label {
      font-size: 18px;
      margin-bottom: 5px;
      display: block;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .contact-form textarea {
      height: 150px;
    }
    .contact-form .checkbox {
      margin: 15px 0;
    }
    .contact-form .checkbox label {
      font-size: 14px;
    }
    button {
      padding: 15px 30px;
      background-color: #FF66B2;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #FF3399;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="contact-page">
    <header>
      <h1>İLETİŞİM</h1>
    </header>

    <section class="contact-info">
      <h2>TÜRKİYE SMA VAKFI</h2>
      <p>Email: <a href="mailto:info@ulusalsma.org.tr">info@ulusalsma.org.tr</a></p>
      <p>Telefon: <a href="tel:+90-222-3355762">0 222 335 57 62</a> | <a href="tel:+90-546-9667905">0 546 966 79 05</a></p>
      <p>Adres: Batıkent Mahallesi Geven Sokak No: 5/B Tepebaşı / Eskişehir</p>
    </section>

    <section class="contact-form">
      <h2>İLETİŞİM FORMU</h2>
      <form id="contactForm" action="#" method="POST">
        <label for="name">Adınız Soyadınız *</label>
        <input type="text" id="name" name="name" required placeholder="Adınızı ve soyadınızı girin">

        <label for="email">E-posta Adresiniz *</label>
        <input type="email" id="email" name="email" required placeholder="E-posta adresinizi girin">

        <label for="phone">Telefon Numaranız *</label>
        <input type="tel" id="phone" name="phone" required placeholder="Telefon numaranızı girin">

        <label for="message">Mesajınız *</label>
        <textarea id="message" name="message" required placeholder="Mesajınızı yazın"></textarea>

        <div class="checkbox">
          <input type="checkbox" id="kvkk" name="kvkk" required>
          <label for="kvkk">KVKK Aydınlatma Metni'ni okudum, anladım.</label>
        </div>

        <button type="submit">Gönder</button>
      </form>
    </section>

    <footer>
      <p>&copy; 2025 ULusal SMA Vakfı</p>
    </footer>
  </div>
</body>
</html>
